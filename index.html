<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RecNet — photos from RecNova</title>
<meta name="description" content="RecNet is where RecNova camera photos live. Fan-made, not affiliated with Rec Room Inc.">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #2a2a2e; color: #f2f2f2; min-height: 100vh;
  }
  header {
    background: #141414; border-bottom: 1px solid #2e2e2e;
    position: sticky; top: 0; z-index: 10;
  }
  .bar {
    max-width: 680px; margin: 0 auto; padding: 14px 20px;
    display: flex; align-items: center; gap: 12px;
  }
  .logo { font-size: 24px; font-weight: 800; color: #ff5a1f; letter-spacing: -.5px; }
  .logo span { color: #f2f2f2; font-weight: 400; }
  .tag { color: #999; font-size: 13px; }
  .count { margin-left: auto; color: #999; font-size: 13px; }
  main { max-width: 680px; margin: 0 auto; padding: 28px 20px 60px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #aaa; font-size: 14px; margin-bottom: 24px; }
  .feed { display: flex; flex-direction: column; gap: 28px; }
  .card {
    background: #1c1c1f; border-radius: 18px; overflow: hidden;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
    cursor: pointer;
  }
  .card-head {
    display: flex; align-items: center; gap: 12px; padding: 14px 16px;
  }
  .avatar {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-weight: 800; font-size: 20px;
  }
  .who { min-width: 0; flex: 1; }
  .who .name { font-weight: 800; font-size: 16px; }
  .who .handle { color: #999; font-size: 13px; }
  .who .room { color: #ff5a1f; font-size: 13px; font-weight: 600; margin-top: 2px; }
  .share { color: #888; font-size: 20px; padding: 8px; }
  .card img.photo { width: 100%; display: block; background: #000; }
  .card-foot {
    display: flex; align-items: center; gap: 16px; padding: 12px 16px;
  }
  .cheers {
    background: none; border: none; cursor: pointer;
    color: #ff5a1f; font-size: 15px; font-weight: 700; font-family: inherit;
    display: flex; align-items: center; gap: 6px; padding: 4px 0;
  }
  .cheers.cheered { color: #ff8c42; }
  .tagged { color: #888; font-size: 13px; margin-left: auto; }
  .time { color: #777; font-size: 12px; padding: 0 16px 14px; }
  .empty {
    text-align: center; padding: 80px 20px; color: #aaa;
    background: #1c1c1f; border-radius: 18px;
  }
  .empty .big { font-size: 52px; margin-bottom: 12px; }
  /* lightbox */
  #lightbox {
    position: fixed; inset: 0; background: rgba(0,0,0,.94);
    display: none; align-items: center; justify-content: center;
    z-index: 50; padding: 24px; cursor: zoom-out;
  }
  #lightbox.open { display: flex; }
  #lightbox figure { max-width: 1000px; width: 100%; }
  #lightbox img { width: 100%; border-radius: 12px; display: block; }
  #lightbox figcaption {
    color: #fff; margin-top: 12px; display: flex; align-items: center; gap: 10px;
  }
  #lightbox .avatar { width: 38px; height: 38px; font-size: 16px; }
  footer { text-align: center; color: #777; font-size: 12px; padding: 24px; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="logo">🌐 rec<span>net</span></div>
    <div class="tag">photos from RecNova</div>
    <div class="count" id="count"></div>
  </div>
</header>
<main>
  <h1>Fresh photos</h1>
  <div class="sub">Snapped with the 📷 Camera in RecNova — saved straight to RecNet.</div>
  <div class="feed" id="feed"></div>
  <div class="empty" id="empty" style="display:none">
    <div class="big">📷</div>
    <p><b>No photos yet.</b></p>
    <p>Take one with the Camera in RecNova and hit <b>Save to RecNet</b>.</p>
  </div>
</main>
<div id="lightbox"><figure>
  <img id="lb-img" alt="RecNet photo">
  <figcaption><div class="avatar" id="lb-av"></div><div><b id="lb-name"></b><div id="lb-room" style="color:#ff5a1f;font-size:13px"></div></div></figcaption>
</figure></div>
<footer>Fan-made project. Not affiliated with Rec Room Inc.</footer>
<script>
const COLORS = ['#ff5a1f','#7c4dff','#0091ea','#00bfa5','#f9a825','#8e24aa','#3949ab','#e83434'];
function colorFor(name){
  let h = 0;
  for(const ch of name) h = (h*31 + ch.charCodeAt(0)) >>> 0;
  return COLORS[h % COLORS.length];
}
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function handleFor(user){ return '@' + user.replace(/\s+/g, ''); }
function cheersKey(p, i){ return 'recnet_cheers_' + i + '_' + p.image.length; }
async function load(){
  let photos = [];
  try { photos = await (await fetch('photos.json', {cache:'no-store'})).json(); } catch(e){}
  const feed = document.getElementById('feed');
  document.getElementById('count').textContent = photos.length ? photos.length + (photos.length===1?' photo':' photos') : '';
  if(!photos.length){ document.getElementById('empty').style.display = 'block'; return; }
  photos.forEach((p, i) => {
    const handle = p.handle || handleFor(p.user);
    const room = p.room || '^RecNova';
    const card = document.createElement('div');
    card.className = 'card';
    const key = cheersKey(p, i);
    const cheered = localStorage.getItem(key) === '1';
    const baseCheers = (p.cheers || 0) + (cheered ? 1 : 0);
    card.innerHTML =
      '<div class="card-head">' +
        '<div class="avatar" style="background:' + colorFor(p.user) + '">' + esc(p.user.charAt(0).toUpperCase()) + '</div>' +
        '<div class="who"><div class="name">' + esc(p.user) + '</div>' +
        '<div class="handle">' + esc(handle) + '</div>' +
        '<div class="room">' + esc(room) + '</div></div>' +
        '<div class="share">⤴</div>' +
      '</div>' +
      '<img class="photo" loading="lazy" src="' + esc(p.image) + '" alt="photo by ' + esc(p.user) + '">' +
      '<div class="card-foot">' +
        '<button class="cheers' + (cheered ? ' cheered' : '') + '">🔥 <span>' + baseCheers + ' cheer' + (baseCheers===1?'':'s') + '</span></button>' +
        (p.tagged ? '<span class="tagged">Tagged players</span>' : '') +
      '</div>' +
      (p.time ? '<div class="time">' + esc(p.time) + '</div>' : '');
    card.querySelector('img.photo').onclick = e => { e.stopPropagation(); openLightbox(p); };
    const btn = card.querySelector('.cheers');
    btn.onclick = e => {
      e.stopPropagation();
      const now = localStorage.getItem(key) !== '1';
      if(now) localStorage.setItem(key, '1'); else localStorage.removeItem(key);
      btn.classList.toggle('cheered', now);
      const n = (p.cheers || 0) + (now ? 1 : 0);
      btn.querySelector('span').textContent = n + ' cheer' + (n===1?'':'s');
    };
    feed.appendChild(card);
  });
}
function openLightbox(p){
  document.getElementById('lb-img').src = p.image;
  const av = document.getElementById('lb-av');
  av.textContent = p.user.charAt(0).toUpperCase();
  av.style.background = colorFor(p.user);
  document.getElementById('lb-name').textContent = p.user + '  ' + (p.handle || handleFor(p.user));
  document.getElementById('lb-room').textContent = p.room || '^RecNova';
  document.getElementById('lightbox').classList.add('open');
}
document.getElementById('lightbox').onclick = () =>
  document.getElementById('lightbox').classList.remove('open');
document.addEventListener('keydown', e => {
  if(e.key === 'Escape') document.getElementById('lightbox').classList.remove('open');
});
load();
</script>
</body>
</html>
